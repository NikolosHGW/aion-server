#
# ----------------------------
# AI config's:
# ----------------------------

# Global switch for all server-controlled player features.
# Default: false
ai.enabled = false

# Stage 1 server-controlled Player spike.
# Default: false
ai.synthetic_players.enabled = false

# Reserved feature flags. They do not enable any stage 1 behavior.
ai.companions.enabled = false
ai.citizens.enabled = false
ai.economy.enabled = false

# Stage 2A companion template and follow hysteresis. Zero IDs mean "not configured".
ai.companions.template_account_id = 0
ai.companions.template_character_id = 0
ai.companions.follow_start_distance = 6
ai.companions.follow_stop_distance = 3
ai.companions.follow_offset_distance = 2
ai.companions.spawn_offset_distance = 2
ai.companions.collision_tolerance = 0.75
ai.companions.destination_update_interval_ms = 400
ai.companions.blocked_retry_interval_ms = 1000

# Stage 2B runtime-only read-only quest goal planner. Empty means no allowed quest.
ai.companions.quest_goals.enabled = false
ai.companions.quest_goals.allowed_quest_ids =

# Stage 2E persistent owner-companion binding and chosen goal intent. Native quest progress is never duplicated here.
ai.companions.goal_persistence.enabled = false

# Stage 2F product creation. The host is a closed service account and never consumes the owner's character slots.
ai.companions.creation.enabled = false
ai.companions.creation.host_account_id = 0
ai.companions.creation.host_account_name =

# Stage 2D native owner quest tracking and quest-scoped combat. Empty means no execution quest is allowed.
ai.companions.quest_execution.enabled = false
ai.companions.quest_execution.combat_enabled = false
ai.companions.quest_execution.allowed_quest_ids =
ai.companions.quest_execution.poll_interval_ms = 1000

# Stage 2C single-hit personal companion combat. All switches are intentionally default-off.
ai.companions.combat.enabled = false
ai.companions.combat.basic_attack.enabled = false
ai.companions.combat.owner_attribution.enabled = false
ai.companions.combat.allowed_npc_ids =
ai.companions.combat.owner_signal_ttl_ms = 3000

# Closed template account and character. Zero means "not configured".
ai.synthetic_players.template_account_id = 0
ai.synthetic_players.template_character_id = 0

# Runtime-only name and a four-point route relative to the administrator.
ai.synthetic_players.runtime_name_prefix = [AI]
ai.synthetic_players.runtime_name_max_length = 16
ai.synthetic_players.route_offsets = 2,0;10,0;10,8;2,8
ai.synthetic_players.route_max_segment_length = 20
ai.synthetic_players.route_arrival_tolerance = 0.35
ai.synthetic_players.route_collision_tolerance = 0.75

# One shared scheduler; no thread is created per AI.
ai.synthetic_players.scheduler_period_ms = 200
ai.synthetic_players.scheduler_max_actions = 1
ai.synthetic_players.scheduler_budget_ms = 2

# Enable NPC movement
# Default: true
gameserver.npcmovement.enable = true

# The minimum time in seconds that the NPC waits before moving again.
# Default: 3 (seconds)
gameserver.npcmovement.delay.minimum = 3

# The maximum time in seconds that the NPC waits before moving again.
# Default: 15 (seconds)
gameserver.npcmovement.delay.maximum = 15

# Enable NPC shouts
# Default: false
gameserver.npcshouts.enable = false

# Location of AI *.java handlers
gameserver.ai.handler_directory = ./data/handlers/ai

# ----------------------------
# AI debug (developer) config's:
# ----------------------------

# Spawn AI NPCs with activated logging attribute
# Default: false
gameserver.ai.oncreate.debug = false

# Log movement for logging enabled NPCs
# Default: true
gameserver.ai.move.debug = true

# Save AI event log in NPC objects (can be retrieved via //ai2 command)
# Default: false
gameserver.ai.event.debug = false
